  <!-- Cryo-Blade / Stealth Energy Core -->
  <path d="M 32 21.5 L 35.2 28.8 L 41 32 L 35.2 35.2 L 32 42.5 L 28.8 35.2 L 23 32 L 28.8 28.8 Z" fill="url(#qCore)"/>
  <circle cx="32" cy="32" r="2.6" fill="#0284c7"/>
  <circle cx="32" cy="32" r="1.2" fill="#e0f2fe"/>

  <!-- Bottom Stealth Mode Indicators -->
  <path d="M 25 48.5 L 32 51 L 39 48.5" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
