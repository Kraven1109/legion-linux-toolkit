  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.35"/>
  <line x1="32" y1="5.5" x2="32" y2="8.5" stroke="#7dd3fc" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="55.5" x2="32" y2="58.5" stroke="#7dd3fc" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
  <line x1="5.5" y1="32" x2="8.5" y2="32" stroke="#7dd3fc" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
  <line x1="55.5" y1="32" x2="58.5" y2="32" stroke="#7dd3fc" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>

  <!-- Cryo-Stealth Acoustic Shield Arc -->
  <path d="M 16.5 41.5 A 18 18 0 1 1 47.5 41.5" fill="none" stroke="#0c4a6e" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 16.5 41.5 A 18 18 0 0 1 32 14" fill="none" stroke="url(#qArc)" stroke-width="2.8" stroke-linecap="round"/>

