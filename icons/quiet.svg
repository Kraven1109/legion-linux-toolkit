<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>
    <radialGradient id="qCoreBg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#0c2d57"/>
      <stop offset="58%" stop-color="#071428"/>
      <stop offset="100%" stop-color="#030710"/>
    </radialGradient>
    <radialGradient id="qHalo" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="qIce" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Outer Machined Titanium Bezel -->
  <circle cx="32" cy="32" r="29" fill="url(#qArmor)" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.65"/>
  <circle cx="32" cy="32" r="26.5" fill="url(#qCoreBg)" stroke="#0ea5e9" stroke-width="0.7" stroke-opacity="0.35"/>
  <circle cx="32" cy="32" r="25" fill="url(#qHalo)"/>

  <!-- Recessed Armor Notches (Cardinal & Diagonal) -->
  <path d="M 29 3.4 L 35 3.4 M 29 60.6 L 35 60.6 M 3.4 29 L 3.4 35 M 60.6 29 L 60.6 35" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <circle cx="13.2" cy="13.2" r="1.1" fill="#38bdf8" opacity="0.7"/>
  <circle cx="50.8" cy="13.2" r="1.1" fill="#38bdf8" opacity="0.7"/>
  <circle cx="13.2" cy="50.8" r="1.1" fill="#38bdf8" opacity="0.7"/>
  <circle cx="50.8" cy="50.8" r="1.1" fill="#38bdf8" opacity="0.7"/>

  <!-- Segmented Cryo Telemetry Ring -->
  <circle cx="32" cy="32" r="23.2" fill="none" stroke="#38bdf8" stroke-width="1.1" stroke-dasharray="6 3 1.5 3" opacity="0.45"/>
  <path d="M 14.5 41 A 19.8 19.8 0 1 1 49.5 41" fill="none" stroke="#0c4a6e" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 14.5 41 A 19.8 19.8 0 0 1 38 13.1" fill="none" stroke="url(#qCyan)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Double Hexagonal Cryo-Chamber -->
  <polygon points="32,16.5 45.4,24.2 45.4,39.8 32,47.5 18.6,39.8 18.6,24.2" fill="#061529" fill-opacity="0.9" stroke="url(#qCyan)" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="32,20 42.4,26 42.4,38 32,44 21.6,38 21.6,26" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.45"/>

  <!-- 6-Axis Cryo Lattice Struts -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="#38bdf8" stroke-width="1.1" opacity="0.5"/>
  <line x1="19.9" y1="25" x2="44.1" y2="39" stroke="#38bdf8" stroke-width="1.1" opacity="0.5"/>
  <line x1="44.1" y1="25" x2="19.9" y2="39" stroke="#38bdf8" stroke-width="1.1" opacity="0.5"/>

  <!-- Faceted Crystalline Cryo-Star Core -->
  <polygon points="32,19.5 35.4,28.6 44.5,32 35.4,35.4 32,44.5 28.6,35.4 19.5,32 28.6,28.6" fill="url(#qIce)"/>
  <polygon points="32,24.5 37.5,26.5 39.5,32 37.5,37.5 32,39.5 26.5,37.5 24.5,32 26.5,26.5" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.8"/>
  <circle cx="32" cy="32" r="3.4" fill="#061529" stroke="#7dd3fc" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>

  <!-- Acoustic Dampening Sub-Zero Waves -->
  <path d="M 23.5 50.2 Q 32 53.8 40.5 50.2" fill="none" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M 26.8 53.5 Q 32 55.8 37.2 53.5" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0.65"/>
</svg>
