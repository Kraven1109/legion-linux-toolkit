      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="qArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="qCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Titanium Disc -->
  <circle cx="32" cy="32" r="28" fill="url(#qBg)"/>
  <circle cx="32" cy="32" r="26" fill="url(#qGlow)"/>

  <!-- Metallic Bevel Rim -->
  <circle cx="32" cy="32" r="27.3" fill="none" stroke="url(#qRim)" stroke-width="1.2"/>

