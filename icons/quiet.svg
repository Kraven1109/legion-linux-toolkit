<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="qBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0f2544"/>
      <stop offset="60%" stop-color="#081326"/>
      <stop offset="100%" stop-color="#040812"/>
    </radialGradient>
    <radialGradient id="qGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qRim" x1="0%" y1="0%" x2="100%" y2="100%">
