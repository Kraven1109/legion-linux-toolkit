<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="50%" stop-color="#240a46"/>
      <stop offset="100%" stop-color="#090214"/>
    </linearGradient>
    <radialGradient id="eCoreBg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#190636"/>
      <stop offset="100%" stop-color="#06010f"/>
    </radialGradient>
    <radialGradient id="eHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.65"/>
      <stop offset="48%" stop-color="#c026d3" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ePlasma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="eBoltL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="eBoltR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
  </defs>

  <!-- Outer Machined Plasma Bezel -->
  <circle cx="32" cy="32" r="29" fill="url(#eArmor)" stroke="#f0abfc" stroke-width="1" stroke-opacity="0.8"/>
  <circle cx="32" cy="32" r="26.5" fill="url(#eCoreBg)" stroke="#d946ef" stroke-width="0.8" stroke-opacity="0.45"/>
  <circle cx="32" cy="32" r="25.5" fill="url(#eHalo)"/>

  <!-- High-Energy Segmented Containment Arcs -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#e879f9" stroke-width="1.1" stroke-dasharray="5 2.8 1.5 2.8" opacity="0.6"/>
  <path d="M 13.5 22 A 21 21 0 0 1 50.5 22" fill="none" stroke="url(#ePlasma)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 50.5 42 A 21 21 0 0 1 13.5 42" fill="none" stroke="url(#ePlasma)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 4 Diagonal Overdrive Shockwave Conduits -->
  <polygon points="12.5,12.5 22,19 19,22" fill="#ffffff"/>
  <polygon points="51.5,12.5 42,19 45,22" fill="#f0abfc"/>
  <polygon points="12.5,51.5 22,45 19,42" fill="#f0abfc"/>
  <polygon points="51.5,51.5 42,45 45,42" fill="#ffffff"/>

  <!-- Dual Counter-Rotated Octagonal Singularity Cage -->
  <polygon points="32,14.5 44.4,19.6 49.5,32 44.4,44.4 32,49.5 19.6,44.4 14.5,32 19.6,19.6" fill="#14052b" fill-opacity="0.88" stroke="url(#ePlasma)" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="32,17.5 46.5,32 32,46.5 17.5,32" fill="none" stroke="#e879f9" stroke-width="1.1" opacity="0.65"/>

  <!-- Inner Core Glow Ring -->
  <circle cx="32" cy="32" r="9.5" fill="#2e1065" stroke="#f0abfc" stroke-width="1" opacity="0.85"/>

  <!-- Faceted 3D Hyper-Voltage Bolt -->
  <polygon points="36.5,15.5 22.5,33.2 31.2,33.2 27.5,48.5 41.5,30.8 32.8,30.8" fill="url(#eBoltL)"/>
  <polygon points="36.5,15.5 32.8,30.8 41.5,30.8 27.5,48.5 31.8,32" fill="url(#eBoltR)" opacity="0.55"/>
</svg>
