<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="eBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="60%" stop-color="#13052b"/>
      <stop offset="100%" stop-color="#070212"/>
    </radialGradient>
    <radialGradient id="eGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.52"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="eArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="eBolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Plasma Disc -->
  <circle cx="32" cy="32" r="28" fill="url(#eBg)"/>
  <circle cx="32" cy="32" r="26" fill="url(#eGlow)"/>

  <!-- Metallic Bevel Rim -->
  <circle cx="32" cy="32" r="27.3" fill="none" stroke="url(#eRim)" stroke-width="1.3"/>

  <!-- Overdrive Dual Segmented Plasma Rings -->
  <path d="M 14 23 A 20 20 0 0 1 50 23" fill="none" stroke="url(#eArc)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 50 41 A 20 20 0 0 1 14 41" fill="none" stroke="url(#eArc)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#d946ef" stroke-width="0.9" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- Diagonal Singularity Energy Fins -->
  <polygon points="15.5,15.5 23,20.5 20.5,23" fill="#e879f9" opacity="0.9"/>
  <polygon points="48.5,15.5 41,20.5 43.5,23" fill="#ffffff" opacity="0.95"/>
  <polygon points="15.5,48.5 23,43.5 20.5,41" fill="#ffffff" opacity="0.95"/>
  <polygon points="48.5,48.5 41,43.5 43.5,41" fill="#e879f9" opacity="0.9"/>

  <!-- Hexagonal Overclock Containment Ring -->
  <polygon points="32,16.5 45.4,24.2 45.4,39.8 32,47.5 18.6,39.8 18.6,24.2" fill="#170733" fill-opacity="0.8" stroke="#e879f9" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Razor Hyper-Bolt Core -->
  <path d="M 35.5 18.5 L 24 33 L 31.2 33 L 28.5 45.5 L 40 31 L 32.8 31 Z" fill="url(#eBolt)"/>
