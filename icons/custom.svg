<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0b2d36"/>
      <stop offset="60%" stop-color="#071920"/>
      <stop offset="100%" stop-color="#030b0f"/>
    </radialGradient>
    <radialGradient id="cGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99f6e4" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#0f766e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="cNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Cyan Disc -->
  <circle cx="32" cy="32" r="28" fill="url(#cBg)"/>
  <circle cx="32" cy="32" r="26" fill="url(#cGlow)"/>

  <!-- Metallic Bevel Rim -->
  <circle cx="32" cy="32" r="27.3" fill="none" stroke="url(#cRim)" stroke-width="1.2"/>

  <!-- Calibration Reticle Ring -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#5eead4" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Precision Matrix Tracks -->
  <line x1="21" y1="18" x2="21" y2="46" stroke="#134e4a" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="21" y1="27" x2="21" y2="46" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round"/>

  <line x1="32" y1="18" x2="32" y2="46" stroke="#134e4a" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="32" y1="37" x2="32" y2="46" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round"/>

  <line x1="43" y1="18" x2="43" y2="46" stroke="#134e4a" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="43" y1="29" x2="43" y2="46" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Hexagonal HUD Fader Nodes -->
  <polygon points="21,21.5 24.8,23.7 24.8,28.3 21,30.5 17.2,28.3 17.2,23.7" fill="url(#cNode)" stroke="#042f2e" stroke-width="1"/>
  <polygon points="32,32.5 35.8,34.7 35.8,39.3 32,41.5 28.2,39.3 28.2,34.7" fill="url(#cNode)" stroke="#042f2e" stroke-width="1"/>
  <polygon points="43,24.5 46.8,26.7 46.8,31.3 43,33.5 39.2,31.3 39.2,26.7" fill="url(#cNode)" stroke="#042f2e" stroke-width="1"/>
