<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="50%" stop-color="#072227"/>
      <stop offset="100%" stop-color="#020a0d"/>
    </linearGradient>
    <radialGradient id="cCoreBg" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#0f3d44"/>
      <stop offset="60%" stop-color="#06191e"/>
      <stop offset="100%" stop-color="#02080a"/>
    </radialGradient>
    <radialGradient id="cHalo" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#0891b2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="cHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Outer Machined Teal Bezel -->
  <circle cx="32" cy="32" r="29" fill="url(#cArmor)" stroke="#5eead4" stroke-width="0.9" stroke-opacity="0.7"/>
  <circle cx="32" cy="32" r="26.5" fill="url(#cCoreBg)" stroke="#14b8a6" stroke-width="0.7" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="25" fill="url(#cHalo)"/>

  <!-- Calibration Reticle Ring & Ticks -->
  <circle cx="32" cy="32" r="23.4" fill="none" stroke="#5eead4" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.45"/>
  <path d="M 32 3.5 L 32 6.8 M 32 57.2 L 32 60.5 M 3.5 32 L 6.8 32 M 57.2 32 L 60.5 32" stroke="#99f6e4" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>

  <!-- Subtle Horizontal Telemetry Grid Lines -->
  <line x1="15" y1="24" x2="49" y2="24" stroke="#2dd4bf" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.35"/>
  <line x1="15" y1="32" x2="49" y2="32" stroke="#2dd4bf" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.35"/>
  <line x1="15" y1="40" x2="49" y2="40" stroke="#2dd4bf" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.35"/>

  <!-- Recessed Track Wells -->
  <rect x="19.3" y="16.5" width="3.4" height="31" rx="1.7" fill="#041317" stroke="#115e59" stroke-width="0.8"/>
  <rect x="30.3" y="16.5" width="3.4" height="31" rx="1.7" fill="#041317" stroke="#115e59" stroke-width="0.8"/>
  <rect x="41.3" y="16.5" width="3.4" height="31" rx="1.7" fill="#041317" stroke="#115e59" stroke-width="0.8"/>

  <!-- Active Glowing Level Columns -->
  <rect x="19.7" y="25" width="2.6" height="22" rx="1.3" fill="url(#cBar)"/>
  <rect x="30.7" y="36" width="2.6" height="11" rx="1.3" fill="url(#cBar)"/>
  <rect x="41.7" y="21" width="2.6" height="26" rx="1.3" fill="url(#cBar)"/>

  <!-- Dynamic Fan/Power Curve Vector Connector -->
  <polyline points="21,25 32,36 43,21" fill="none" stroke="#99f6e4" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75"/>

  <!-- 3D Beveled Hexagonal Fader Knobs -->
  <polygon points="21,20.2 25.2,22.6 25.2,27.4 21,29.8 16.8,27.4 16.8,22.6" fill="url(#cHex)" stroke="#042f2e" stroke-width="1.1"/>
  <circle cx="21" cy="25" r="1.6" fill="#042f2e"/>

  <polygon points="32,31.2 36.2,33.6 36.2,38.4 32,40.8 27.8,38.4 27.8,33.6" fill="url(#cHex)" stroke="#042f2e" stroke-width="1.1"/>
  <circle cx="32" cy="36" r="1.6" fill="#042f2e"/>

  <polygon points="43,16.2 47.2,18.6 47.2,23.4 43,25.8 38.8,23.4 38.8,18.6" fill="url(#cHex)" stroke="#042f2e" stroke-width="1.1"/>
  <circle cx="43" cy="21" r="1.6" fill="#042f2e"/>
</svg>
