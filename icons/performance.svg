<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#350a14"/>
      <stop offset="60%" stop-color="#18050a"/>
      <stop offset="100%" stop-color="#090204"/>
    </radialGradient>
    <radialGradient id="pGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b5c" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#dc2626" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="pArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#ff1f4b"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pNeedle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Crimson Disc -->
  <circle cx="32" cy="32" r="28" fill="url(#pBg)"/>
  <circle cx="32" cy="32" r="26" fill="url(#pGlow)"/>

  <!-- Metallic Bevel Rim -->
  <circle cx="32" cy="32" r="27.3" fill="none" stroke="url(#pRim)" stroke-width="1.2"/>

  <!-- Outer Telemetry Bracket Ticks -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#fb7185" stroke-width="0.9" stroke-dasharray="1.5 4.5" opacity="0.4"/>
  <path d="M 14 14 L 17 17 M 50 14 L 47 17 M 14 50 L 17 47 M 50 50 L 47 47" stroke="#fb7185" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

  <!-- Base Tachometer Track -->
  <path d="M 18 44 A 18.5 18.5 0 1 1 46 44" fill="none" stroke="#4c0519" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Active Overboost Redline Arc -->
  <path d="M 18 44 A 18.5 18.5 0 1 1 48.2 40.5" fill="none" stroke="url(#pArc)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Segmented Precision Gauge Ticks -->
  <line x1="16.5" y1="33" x2="19.5" y2="33" stroke="#fda4af" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <line x1="20.5" y1="21.5" x2="22.8" y2="23.8" stroke="#fda4af" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="16.5" x2="32" y2="19.8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43.5" y1="21.5" x2="41.2" y2="23.8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="47.5" y1="33" x2="44.5" y2="33" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Razor-Wedge Tachometer Needle Locked in Redline -->
  <polygon points="30.2,34.5 45.5,20.5 33.8,36.2" fill="url(#pNeedle)"/>

  <!-- Hub Reactor Core -->
  <circle cx="32" cy="34" r="4.8" fill="#18050a" stroke="#ff4d6d" stroke-width="1.6"/>
  <circle cx="32" cy="34" r="2.1" fill="#ffffff"/>

  <!-- Twin Afterburner Boost Chevrons -->
  <path d="M 27 48.5 L 32 45 L 37 48.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M 28.5 52.5 L 32 50 L 35.5 52.5" fill="none" stroke="#fb7185" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
