<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#2a0810"/>
      <stop offset="100%" stop-color="#0c0205"/>
    </linearGradient>
    <radialGradient id="pCoreBg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="58%" stop-color="#1c040b"/>
      <stop offset="100%" stop-color="#080103"/>
    </radialGradient>
    <radialGradient id="pHalo" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#ff2a54" stop-opacity="0.58"/>
      <stop offset="52%" stop-color="#e11d48" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pRedline" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="45%" stop-color="#ff1f4b"/>
      <stop offset="80%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pBlade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1f4b"/>
      <stop offset="50%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Outer Machined Crimson Bezel -->
  <circle cx="32" cy="32" r="29" fill="url(#pArmor)" stroke="#fb7185" stroke-width="0.9" stroke-opacity="0.75"/>
  <circle cx="32" cy="32" r="26.5" fill="url(#pCoreBg)" stroke="#f43f5e" stroke-width="0.7" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="25" fill="url(#pHalo)"/>

  <!-- Corner HUD Targeting Reticles -->
  <path d="M 32 3.4 L 32 6.8 M 3.4 32 L 6.8 32 M 60.6 32 L 57.2 32" stroke="#fda4af" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#fb7185" stroke-width="0.9" stroke-dasharray="1.8 3.6" opacity="0.45"/>

  <!-- Tachometer Recessed Track & Active Redline Arc -->
  <path d="M 16.2 44.2 A 20 20 0 1 1 47.8 44.2" fill="none" stroke="#3b0614" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 16.2 44.2 A 20 20 0 1 1 49.4 41.8" fill="none" stroke="url(#pRedline)" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Precision Radial Gauge Ticks -->
  <line x1="15.8" y1="32" x2="19.2" y2="32" stroke="#fda4af" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  <line x1="18.2" y1="22.5" x2="21.2" y2="24.5" stroke="#fda4af" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <line x1="24.5" y1="16.2" x2="26.2" y2="19.4" stroke="#fda4af" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="14.5" x2="32" y2="18.2" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="39.5" y1="16.2" x2="37.8" y2="19.4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="45.8" y1="22.5" x2="42.8" y2="24.5" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
  <line x1="48.2" y1="32" x2="44.5" y2="32" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Aerodynamic Split-Blade Tachometer Needle -->
  <polygon points="27.5,36.8 30.2,31.2 46.8,24.2 33.8,35.8" fill="url(#pBlade)"/>
  <line x1="29" y1="34.5" x2="45.5" y2="24.8" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Center Reactor Hub -->
  <circle cx="32" cy="33.5" r="5.4" fill="#180409" stroke="#ff2a54" stroke-width="1.7"/>
  <circle cx="32" cy="33.5" r="2.4" fill="#ffffff"/>

  <!-- Triple Afterburner Thruster Chevrons -->
  <path d="M 26 46.5 L 32 42.5 L 38 46.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 27.2 50.8 L 32 47.4 L 36.8 50.8" fill="none" stroke="#fb7185" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <path d="M 28.6 54.8 L 32 52.3 L 35.4 54.8" fill="none" stroke="#f43f5e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
</svg>
