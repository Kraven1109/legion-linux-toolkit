<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Charcoal Background -->
    <linearGradient id="bgOff" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#1e1e1e"/>
    </linearGradient>
    
    <!-- Dimmed Metallic Silhouette -->
    <linearGradient id="dimYGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9e9e9e"/>
      <stop offset="100%" stop-color="#616161"/>
    </linearGradient>

    <linearGradient id="dimBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Outer Disc -->
  <rect x="6" y="6" width="52" height="52" rx="26" fill="url(#bgOff)"/>
  
  <!-- Subtle 3D Rim -->
  <path d="M 32 6 A 26 26 0 0 1 58 32 A 26 26 0 0 0 32 7 A 26 26 0 0 0 6 32 A 26 26 0 0 1 32 6 Z" fill="#ffffff" opacity="0.1"/>
  <path d="M 6 32 A 26 26 0 0 0 32 58 A 26 26 0 0 0 58 32 A 26 26 0 0 1 32 57 A 26 26 0 0 1 6 32 Z" fill="#000000" opacity="0.4"/>

  <!-- Dimmed Authentic Legion "Y" Shape -->
  <path d="M 29.5 49 
           L 29.5 29.5 
           L 17.5 15.5 
           L 22.5 12 
           L 32 25 
           L 41.5 12 
           L 46.5 15.5 
           L 34.5 29.5 
           L 34.5 49 
           Z" 
        fill="url(#dimYGrad)" opacity="0.6"/>

  <!-- Beveled facet -->
  <path d="M 29.5 49 
           L 29.5 29.5 
           L 17.5 15.5 
           L 22.5 12 
           L 32 25 
           L 32 49 
           Z" 
        fill="url(#dimBevel)" opacity="0.6"/>

  <!-- Subtle clean strike-through indicator -->
  <line x1="17" y1="47" x2="47" y2="17" stroke="#e53935" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
</svg>
