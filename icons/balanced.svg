<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>
    <radialGradient id="bGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#94a3b8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="bSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bWing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Titanium Disc -->
  <circle cx="32" cy="32" r="28" fill="url(#bBg)"/>
  <circle cx="32" cy="32" r="26" fill="url(#bGlow)"/>

  <!-- Metallic Bevel Rim -->
  <circle cx="32" cy="32" r="27.3" fill="none" stroke="url(#bRim)" stroke-width="1.2"/>

  <!-- Precision Calibration Ring -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.35"/>
  <line x1="32" y1="5.5" x2="32" y2="8.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <line x1="32" y1="55.5" x2="32" y2="58.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
  <line x1="5.5" y1="32" x2="8.5" y2="32" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <line x1="55.5" y1="32" x2="58.5" y2="32" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- Dual Interlocking Gyroscopic Equilibrium Rings -->
  <ellipse cx="32" cy="32" rx="18.5" ry="7.5" transform="rotate(-32 32 32)" fill="none" stroke="url(#bSilver)" stroke-width="1.8" opacity="0.85"/>
  <ellipse cx="32" cy="32" rx="18.5" ry="7.5" transform="rotate(32 32 32)" fill="none" stroke="url(#bSilver)" stroke-width="1.8" opacity="0.85"/>

  <!-- Symmetrical Horizontal Power Allocation Horizon -->
  <line x1="13" y1="32" x2="23" y2="32" stroke="url(#bWing)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="41" y1="32" x2="51" y2="32" stroke="url(#bWing)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Central Diamond Equilibrium Core -->
  <polygon points="32,23 40,32 32,41 24,32" fill="#0f172a" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="32,27 36.5,32 32,37 27.5,32" fill="url(#bSilver)"/>
  <circle cx="32" cy="32" r="1.5" fill="#0f172a"/>
</svg>
