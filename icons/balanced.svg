<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="bCoreBg" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#273549"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <radialGradient id="bHalo" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#94a3b8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bPlat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="bOrbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Outer Machined Titanium Bezel -->
  <circle cx="32" cy="32" r="29" fill="url(#bArmor)" stroke="#e2e8f0" stroke-width="0.9" stroke-opacity="0.7"/>
  <circle cx="32" cy="32" r="26.5" fill="url(#bCoreBg)" stroke="#94a3b8" stroke-width="0.7" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="25" fill="url(#bHalo)"/>

  <!-- Precision Gimbal Degree Ticks -->
  <circle cx="32" cy="32" r="23.4" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3.1" opacity="0.45"/>
  <path d="M 32 3.5 L 32 7.5 M 32 56.5 L 32 60.5 M 3.5 32 L 7.5 32 M 56.5 32 L 60.5 32" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>

  <!-- Outer Gimbal Stabilization Ring -->
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="#64748b" stroke-width="0.9" opacity="0.5"/>

  <!-- Tri-Axis Quantum Gyroscope Orbits -->
  <ellipse cx="32" cy="32" rx="19.5" ry="7.2" transform="rotate(-35 32 32)" fill="none" stroke="url(#bOrbit)" stroke-width="1.9"/>
  <ellipse cx="32" cy="32" rx="19.5" ry="7.2" transform="rotate(35 32 32)" fill="none" stroke="url(#bOrbit)" stroke-width="1.9"/>
  <ellipse cx="32" cy="32" rx="19.5" ry="5.2" fill="none" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="3 2" opacity="0.65"/>

  <!-- Orbital Equilibrium Satellite Nodes -->
  <circle cx="16" cy="20.8" r="1.9" fill="#ffffff"/>
  <circle cx="48" cy="20.8" r="1.9" fill="#ffffff"/>
  <circle cx="16" cy="43.2" r="1.9" fill="#e2e8f0"/>
  <circle cx="48" cy="43.2" r="1.9" fill="#e2e8f0"/>

  <!-- Central Faceted Platinum Core -->
  <polygon points="32,20.5 43.5,32 32,43.5 20.5,32" fill="#0f172a" stroke="url(#bPlat)" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="32,24.2 39.8,32 32,39.8 24.2,32" fill="url(#bPlat)"/>
  <polygon points="32,28 36,32 32,36 28,32" fill="#0f172a"/>
  <circle cx="32" cy="32" r="1.8" fill="#ffffff"/>
</svg>
