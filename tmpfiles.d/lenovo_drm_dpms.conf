# Allow legion-profile-osd to temporarily pin external DRM connector status to 'on' ONLY while
# the session is idle in DPMS Off (and release back to 'detect' immediately on user activity).
# Prevents USB-C-to-HDMI bridges from triggering HPD disconnect/reconnect wake loops during DPMS sleep.
z /sys/class/drm/card*-DP-*/status 0666 root root -
z /sys/class/drm/card*-HDMI-*/status 0666 root root -
