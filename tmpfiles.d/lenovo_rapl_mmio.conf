# Allow sudo-less MMIO RAPL PL1/PL2 tuning via lmode and legion-profile-osd
z /sys/devices/virtual/powercap/intel-rapl-mmio/intel-rapl-mmio:0/constraint_0_power_limit_uw 0666 root root -
z /sys/devices/virtual/powercap/intel-rapl-mmio/intel-rapl-mmio:0/constraint_1_power_limit_uw 0666 root root -

# Allow sudo-less read of SMBIOS Type 17 Memory Device entries (DDR type, MT/s speed, DIMM capacity) for lstats
z /sys/firmware/dmi/entries/17-*/raw 0444 root root -

# Allow unprivileged reading of i915/xe GPU engine busyness PMU counters for lstats
w /proc/sys/kernel/perf_event_paranoid - - - - 0
